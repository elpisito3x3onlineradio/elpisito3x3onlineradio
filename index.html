<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL PISITO ONLINE RADIO 3X3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    color:#fff;

    background:
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.75)),
    url("estadio.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
color:#fff;

}

nav{

position:fixed;
top:0;
left:0;
width:100%;
padding:18px 40px;
background:rgba(0,0,0,.85);
backdrop-filter:blur(10px);
display:flex;
justify-content:space-between;
align-items:center;
z-index:999;

}

.logo{

display:flex;
align-items:center;
gap:15px;

}

.logo img{

width:60px;

}

.logo h2{

color:#00ff88;
font-size:26px;

}

.menu{

display:flex;
gap:25px;

}

.menu a{

color:white;
text-decoration:none;
font-weight:600;

}

.hero{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:100px 20px;

}

.hero img{

width:280px;
max-width:90%;
filter:drop-shadow(0 0 25px #00ff88);

}

.hero h1{

font-size:60px;
margin-top:25px;

}

.hero p{

font-size:22px;
margin-top:15px;
color:#ddd;

}

.boton{

display:inline-block;
margin-top:30px;
padding:18px 50px;
background:#00ff88;
color:black;
font-size:26px;
font-weight:bold;
border-radius:50px;
text-decoration:none;
box-shadow:0 0 25px #00ff88;

}

.youtube{

display:inline-block;
margin-top:20px;
padding:18px 40px;
background:#ff0000;
color:white;
text-decoration:none;
border-radius:50px;
font-size:22px;
font-weight:bold;

}

.equalizer{

margin-top:40px;
display:flex;
justify-content:center;
gap:6px;

}

.equalizer span{

width:8px;
height:20px;
background:#00ff88;
animation:wave 1s infinite;

}

.equalizer span:nth-child(2){animation-delay:.2s;}
.equalizer span:nth-child(3){animation-delay:.4s;}
.equalizer span:nth-child(4){animation-delay:.6s;}
.equalizer span:nth-child(5){animation-delay:.8s;}

@keyframes wave{

0%,100%{height:20px;}
50%{height:70px;}

}

section{

padding:80px 10%;

}

.titulo{

text-align:center;
font-size:42px;
color:#00ff88;
margin-bottom:40px;

}

.card{

background:rgba(255,255,255,.08);
padding:30px;
border-radius:20px;
backdrop-filter:blur(8px);
text-align:center;

}

footer{

background:#050505;
padding:35px;
text-align:center;

}

@media(max-width:768px){

.menu{
display:none;
}

.hero h1{
font-size:40px;
}

}
</style>
</head>

<body>

<nav>

<div class="logo">

<img src="logo.png">

<h2>EL PISITO RADIO</h2>

</div>

<div class="menu">

<a href="#inicio">Inicio</a>

<a href="#radio">Radio</a>

<a href="#youtube">YouTube</a>

<a href="#programacion">Programación</a>

<a href="#contacto">Contacto</a>

</div>

</nav>

<section class="hero" id="inicio">

<div>

<img src="logo.png">

<h1>EL PISITO ONLINE RADIO 3X3</h1>

<p>Tu Radio • Tu Pasión • Tu Canal</p>

<a href="#" class="boton">▶ ESCUCHAR EN VIVO</a>

<br>

<a class="youtube"
target="_blank"
href="https://www.youtube.com/watch?v=i1ZG-V7UCmw">

🔴 VER CANAL DE YOUTUBE

</a>

<div class="equalizer">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

</div>

</section>
