<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL PISITO ONLINE RADIO 3X3</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:#000;
color:white;
overflow-x:hidden;

background-image:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.82)),
url("fondo.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;

}

/* MENU */

nav{

position:fixed;
top:0;
left:0;
width:100%;
padding:18px 40px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.85);
backdrop-filter:blur(10px);
z-index:9999;
box-shadow:0 0 20px #00ff88;

}

.logo{

display:flex;
align-items:center;
gap:15px;

}

.logo img{

width:65px;

}

.logo h2{

color:#00ff88;
font-size:28px;
font-weight:800;

}

.menu{

display:flex;
gap:30px;

}

.menu a{

color:white;
text-decoration:none;
font-weight:600;
transition:.3s;

}

.menu a:hover{

color:#00ff88;

}

.hero{

height:100vh;

display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:100px 20px;

}

.hero img{

width:320px;
filter:drop-shadow(0 0 30px #00ff88);

}

.hero h1{

font-size:72px;
margin-top:30px;
font-weight:900;

}

.hero p{

font-size:25px;
margin-top:15px;
color:#ddd;

}

.play{

display:inline-block;
margin-top:35px;
padding:20px 60px;
background:#00ff88;
color:black;
font-size:28px;
font-weight:700;
border-radius:60px;
text-decoration:none;
box-shadow:0 0 35px #00ff88;
transition:.3s;

}

.play:hover{

transform:scale(1.05);

}

.equalizer{

display:flex;
justify-content:center;
gap:6px;
margin-top:50px;

}

.equalizer span{

width:8px;
height:25px;
background:#00ff88;
animation:wave 1s infinite;

}

.equalizer span:nth-child(2){animation-delay:.2s;}
.equalizer span:nth-child(3){animation-delay:.4s;}
.equalizer span:nth-child(4){animation-delay:.6s;}
.equalizer span:nth-child(5){animation-delay:.8s;}
.equalizer span:nth-child(6){animation-delay:1s;}

@keyframes wave{

0%,100%{

height:20px;

}

50%{

height:70px;

}

}

section{

padding:90px 10%;

}

.titulo{

font-size:45px;
margin-bottom:40px;
color:#00ff88;
text-align:center;

}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;

}

.card{

background:rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
backdrop-filter:blur(8px);
transition:.3s;

}

.card:hover{

transform:translateY(-10px);
box-shadow:0 0 30px #00ff88;

}

.card h3{

margin-bottom:15px;
color:#00ff88;

}

footer{

background:#050505;
padding:40px;
text-align:center;
margin-top:60px;
border-top:2px solid #00ff88;

}

.whatsapp{

position:fixed;
right:20px;
bottom:20px;
background:#25D366;
width:65px;
height:65px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
text-decoration:none;
color:white;
box-shadow:0 0 20px #25D366;
z-index:99999;

}

@media(max-width:768px){

.menu{

display:none;

}

.hero h1{

font-size:42px;

}

.hero img{

width:220px;

}

}

</style>
